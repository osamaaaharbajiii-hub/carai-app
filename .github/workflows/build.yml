name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate Android project
        run: flutter create --project-name=carai_app --platforms=android .

      - name: Fix Bluetooth & Android Settings
        run: |
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' android/app/build.gradle

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
